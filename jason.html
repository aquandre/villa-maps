<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Villa Map</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    .mapboxgl-popup-content {
      background: black;
      color: white;
      border-radius: 12px;
      padding: 12px;
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    .card { width: 100%; box-sizing: border-box; }
    .card img { display: block; width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
    .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .card p { margin: 0 0 8px; font-size: 13px; }
    .btn { display: block; width: 100%; padding: 8px 10px; box-sizing: border-box; border-radius: 6px; text-align: center; text-decoration: none; background: white; color: black; font-weight: 600; font-size: 14px; margin-top: 6px; }
    .btn:hover { filter: brightness(0.9); }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYXF1YW5kcmUiLCJhIjoiY21lZnRoN3U5MHRjeTJsc2FuOGVzbXJyeiJ9.6BdkovM7dUalGQblQZVyCg';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: [25.323824, 37.467993],
      zoom: 10
    });
    map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }));

    // ======================
    // Helper: get query param
    // ======================
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // ======================
    // Load villa data (JSON from GitHub)
    // ======================
    const defaultDataFile = 'https://raw.githubusercontent.com/aquandre/villa-maps/refs/heads/main/test.json';
    const dataFile = getQueryParam('data') || defaultDataFile;

    fetch(dataFile)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(villas => {
        // Convert villa array into GeoJSON
        const geojson = {
          type: 'FeatureCollection',
          features: villas.map(villa => ({
            type: 'Feature',
            geometry: {
              type: 'Point',
              coordinates: villa.coords
            },
            properties: {
              name: villa.name,
              bedrooms: villa.bedrooms,
              price: villa.price,
              image: villa.image,
              link: villa.link,
              town: villa.town || ''
            }
          }))
        };

        map.on('load', () => {
          // Add source with clustering enabled
          map.addSource('villas', {
            type: 'geojson',
            data: geojson,
            cluster: true,
            clusterMaxZoom: 14,
            clusterRadius: 50
          });

          // Cluster circles (black)
          map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'villas',
            filter: ['has', 'point_count'],
            paint: {
              'circle-color': '#000',
              'circle-radius': 18
            }
          });

          // Cluster text (white numbers)
          map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'villas',
            filter: ['has', 'point_count'],
            layout: {
              'text-field': '{point_count_abbreviated}',
              'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
              'text-size': 12
            },
            paint: {
              'text-color': '#fff'
            }
          });

          // Unclustered points (individual villas = black dot)
          map.addLayer({
            id: 'unclustered-point',
            type: 'circle',
            source: 'villas',
            filter: ['!', ['has', 'point_count']],
            paint: {
              'circle-color': '#000',
              'circle-radius': 8,
              'circle-stroke-width': 1,
              'circle-stroke-color': '#fff'
            }
          });

          // Fit map to all villas
          const bounds = new mapboxgl.LngLatBounds();
          geojson.features.forEach(f => bounds.extend(f.geometry.coordinates));
          if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 80 });

          // Show popup on villa click
          map.on('click', 'unclustered-point', e => {
            const props = e.features[0].properties;
            const coords = e.features[0].geometry.coordinates;

            const popupHTML = `
              <div class="card">
                <img src="${props.image}" alt="${props.name}" />
                <h3>${props.name} | ${props.bedrooms} bedrooms</h3>
                <p><strong>${props.price}</strong> per night</p>
                ${props.town ? `<p>Near ${props.town}</p>` : ''}
                <a class="btn" href="${props.link}" target="_blank" rel="noopener">View Villa</a>
              </div>
            `;

            new mapboxgl.Popup()
              .setLngLat(coords)
              .setHTML(popupHTML)
              .addTo(map);
          });

          // Zoom into cluster on click
          map.on('click', 'clusters', e => {
            const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
            const clusterId = features[0].properties.cluster_id;
            map.getSource('villas').getClusterExpansionZoom(clusterId, (err, zoom) => {
              if (err) return;
              map.easeTo({
                center: features[0].geometry.coordinates,
                zoom
              });
            });
          });

          // Change cursor for clusters
          map.on('mouseenter', 'clusters', () => map.getCanvas().style.cursor = 'pointer');
          map.on('mouseleave', 'clusters', () => map.getCanvas().style.cursor = '');
        });
      })
      .catch(err => {
        console.error('Error loading villa data:', err);
      });
  </script>
</body>
</html>
