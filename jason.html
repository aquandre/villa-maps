<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Villa Map</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    /* Price bubble marker */
    .price-marker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.25);
      font: 600 13px/1.1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #111;
      letter-spacing: 0.2px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transform: translateY(-4px);
    }
    .price-marker:hover {
      background: #111;
      color: #fff;
    }

    /* Cluster style via Mapbox layer */
    .mapboxgl-popup-content {
      background: black;
      color: white;
      border-radius: 12px;
      padding: 12px;
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    .card { width: 100%; box-sizing: border-box; }
    .card img { display: block; width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
    .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .card p { margin: 0 0 8px; font-size: 13px; }
    .btn { display: block; width: 100%; padding: 8px 10px; box-sizing: border-box; border-radius: 6px; text-align: center; text-decoration: none; background: white; color: black; font-weight: 600; font-size: 14px; margin-top: 6px; }
    .btn:hover { filter: brightness(0.9); }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'YOUR_MAPBOX_ACCESS_TOKEN';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: [25.323824, 37.467993],
      zoom: 10
    });
    map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }));

    // JSON file URL
    const dataFile = 'https://raw.githubusercontent.com/aquandre/villa-maps/main/test.json';

    fetch(dataFile)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(villas => {
        // Transform villas into GeoJSON
        const geojson = {
          type: "FeatureCollection",
          features: villas.map(villa => ({
            type: "Feature",
            properties: {
              name: villa.name,
              bedrooms: villa.bedrooms,
              price: villa.price,
              image: villa.image,
              link: villa.link
            },
            geometry: {
              type: "Point",
              coordinates: villa.coords
            }
          }))
        };

        // Add as a source with clustering
        map.addSource('villas', {
          type: 'geojson',
          data: geojson,
          cluster: true,
          clusterMaxZoom: 14,
          clusterRadius: 50
        });

        // Cluster circles
        map.addLayer({
          id: 'clusters',
          type: 'circle',
          source: 'villas',
          filter: ['has', 'point_count'],
          paint: {
            'circle-color': '#000',
            'circle-radius': 20
          }
        });

        // Cluster count labels
        map.addLayer({
          id: 'cluster-count',
          type: 'symbol',
          source: 'villas',
          filter: ['has', 'point_count'],
          layout: {
            'text-field': '{point_count_abbreviated}',
            'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
            'text-size': 14
          },
          paint: {
            'text-color': '#fff'
          }
        });

        // Individual villa price bubbles
        villas.forEach(villa => {
          const el = document.createElement('div');
          el.className = 'price-marker';
          el.textContent = villa.price;

          const popupHTML = `
            <div class="card">
              <img src="${villa.image}" alt="${villa.name}" />
              <h3>${villa.name} | ${villa.bedrooms} bedrooms</h3>
              <p><strong>${villa.price}</strong> per night</p>
              <a class="btn" href="${villa.link}" target="_blank" rel="noopener">View Villa</a>
            </div>
          `;
          const popup = new mapboxgl.Popup({ offset: [0, -40] }).setHTML(popupHTML);

          new mapboxgl.Marker({ element: el, anchor: 'bottom' })
            .setLngLat(villa.coords)
            .setPopup(popup)
            .addTo(map);
        });

        // Zoom to fit all villas
        const bounds = new mapboxgl.LngLatBounds();
        villas.forEach(v => bounds.extend(v.coords));
        if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 80, maxZoom: 14 });

        // Zoom into cluster on click
        map.on('click', 'clusters', (e) => {
          const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
          const clusterId = features[0].properties.cluster_id;
          map.getSource('villas').getClusterExpansionZoom(clusterId, (err, zoom) => {
            if (err) return;
            map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom });
          });
        });

        // Change cursor on hover
        map.on('mouseenter', 'clusters', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'clusters', () => map.getCanvas().style.cursor = '');
      })
      .catch(err => console.error('Error loading villa data:', err));
  </script>
</body>
</html>
